<!doctype html>
<html lang="en" data-theme="stage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12110e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312110e'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='8' fill='none' stroke='%23ff2b8f' stroke-width='4' transform='rotate(-20 32 32)'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f2f1ec'/%3E%3C/svg%3E">
  <title>ascii / milky way</title>
  <meta name="description" content="The Milky Way, ray-marched live and typed in ASCII. After ascii/horizon by Siddharth Meena.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main class="stage" id="stage" aria-label="The Milky Way, drawn live in letters. Drag to tilt it, scroll to zoom, click the disk to set off a supernova.">
    <canvas id="cv"></canvas>
    <noscript><p class="fallback">This renders live with JavaScript and WebGL 2.</p></noscript>
  </main>

  <header class="top chrome">
    <div class="mark">ascii<b>/</b>milky way</div>
    <nav class="tools" aria-label="View">
      <button data-k="v" aria-keyshortcuts="V">view</button>
      <button data-k="t" aria-keyshortcuts="T">theme</button>
      <button data-k="y" aria-keyshortcuts="Y" aria-pressed="true">sun</button>
      <button data-k="h" aria-keyshortcuts="H">hide</button>
    </nav>
  </header>

  <footer class="foot chrome">
    <p class="spec" id="spec" aria-hidden="true"></p>
    <div class="meta">
      <span class="hint" id="hint">Drag to tilt. Scroll to zoom. Click the disk for a supernova.</span>
      <span>after <a href="https://github.com/SiddDevZ/horizon">ascii/horizon</a> by Siddharth Meena</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
